<div class="mb-16">
    <div class="flex items-center justify-center mb-12">
        <div
            class="w-16 h-16 bg-gradient-to-br {{ tool_data.icon.gradient }} rounded-xl flex items-center justify-center shadow-lg mr-4">
            <span class="text-white font-bold text-2xl">{{ tool_data.icon.text }}</span>
        </div>
        <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-800">{{ tool_data.title }}</h1>
    </div>


    <div class="flex flex-wrap justify-center gap-6">
        {% for tool in tool_data.tools %}
        <a href="{{ tool.link }}" target="_blank" rel="noopener noreferrer" class="w-32">
            <div class="flex flex-col items-center p-4 hover:bg-blue-100 rounded-lg cursor-pointer transition-colors">
                <div
                    class="w-16 h-16 bg-gradient-to-br {{ tool.gradient }} rounded-xl flex items-center justify-center mb-2 shadow-lg">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                        <span class="{{ tool.text_color }} font-bold text-lg">{{ tool.icon }}</span>
                    </div>
                </div>
                <span class="text-sm font-medium text-gray-700 text-center">{{ tool.name }}</span>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
